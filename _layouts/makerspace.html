---
layout: null
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-makerspace-base="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: 'Makerspace' }} · {{ site.title | default: 'Del Norte Makerspace' }}</title>
  {% if site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}?v=ms3d1">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}?v=ms3d1">
  <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}?v=ms3d1">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}?v=ms3d1">
<link rel="stylesheet" href="{{ '/assets/css/makerspace.css' | relative_url }}?v=ms20">
<script>
    // Injected so JS redirects always respect site.baseurl (never drops a path prefix).
    window.MAKERSPACE_BASE = {{ site.baseurl | jsonify }};
    // Makerspace API (auth, inventory, members, requests) — localhost auto-detect.
    window.MAKERSPACE_API = {{ site.makerspace_api | default: '' | jsonify }};
    // Flask microblog — primary request chat (guest auth, no OCS login).
    // Empty → localhost:8587 / https://flask.opencodingsociety.com.
    window.MAKERSPACE_FLASK_API = {{ site.makerspace_flask_api | default: '' | jsonify }};
    // Optional OCS Spring chat fallback (needs group id / security patch for REST).
    window.MAKERSPACE_SPRING_API = {{ site.makerspace_spring_api | default: '' | jsonify }};
    window.MAKERSPACE_SPRING_GROUP_ID = {{ site.makerspace_spring_group_id | default: '' | jsonify }};
  </script>
</head>
<body class="makerspace-body">
  {% include makerspace-topbar.html %}

  <div class="makerspace-shell">
    <main class="makerspace-main" id="main">
      {{ content }}
    </main>

    <footer class="makerspace-footer">
      <div class="makerspace-footer-inner">
        <div class="footer-brand">
          <span class="makerspace-brand-mark small" aria-hidden="true">3D</span>
          <div>
            <strong>Del Norte Makerspace</strong>
            <span>Design · Prototype · Print</span>
          </div>
        </div>
        <nav class="footer-nav" aria-label="Footer">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/submit/' | relative_url }}" id="footerSubmitLink" data-auth-area="signed-in" hidden>Submit</a>
          <a href="{{ '/requests/' | relative_url }}">Requests</a>
          <a href="{{ '/signin/' | relative_url }}">Sign In</a>
          <a href="{{ '/admin/' | relative_url }}" id="footerAdminLink" data-auth-area="signed-in" hidden>Admin</a>
        </nav>
      </div>
    </footer>
  </div>

  <script src="{{ '/assets/js/makerspace/microblog-chat.js' | relative_url }}?v=ms20"></script>
  <script src="{{ '/assets/js/makerspace/spring-chat.js' | relative_url }}?v=ms20"></script>
  <script src="{{ '/assets/js/makerspace.js' | relative_url }}?v=ms20"></script>
</body>
</html>
