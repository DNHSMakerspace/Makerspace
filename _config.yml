# Site-wide settings
# ------------------
#
# title: Your awesome title
#
# author:
#   name: GitHub User
#   email: your-email@domain.com
#
# The `>` after `description:` means to ignore line-breaks until next key. If
#   you wish to omit the line-break after the end of text, use `>-` instead.
# description: >
#   Write an awesome description for your new site here. You can edit this line
#   in _config.yml. It will appear in your document head meta (for Google search
#   results) and in your feed.xml site description.

title: Del Norte High School Makerspace
description: "3D printing requests for the Del Norte High School Makerspace."
owner_name: Del Norte High School
github_username: makerspace
github_repo: "makerspace"
baseurl: ""
future: true

# Shared makerspace API (auth, chats, inventory, requests across devices).
# Local dev: makerspace_backend/server.py on :8787 (auto-detected on localhost).
# Production: set the public base URL of your deployed makerspace API here.
makerspace_api: ""

# Single source of truth for the Google OAuth client id -- assets/js/api/config.js's
# GOOGLE_CLIENT_ID and login.md's #g_id_onload data-client_id both pull from this at
# build time via Liquid, so the two can never drift out of sync with each other again.
google_client_id: "65827797404-ccjleg7jg4g2an8ddpmhnlca4ii2gk8q.apps.googleusercontent.com"

# Exclude from the public site build.
# Makerspace-only site: only makerspace pages + their assets should publish.
# Everything else (courses, navigation, games, legacy pages) is kept in the repo
# but is not generated, so those URLs 404.
