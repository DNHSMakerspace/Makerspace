name: Create assignments from frontmatter

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Reconcile daily so a temporary Spring outage cannot leave assignments stale.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: assignment-frontmatter-sync
  cancel-in-progress: false

jobs:
  create-assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run create assignments script
        env:
          BASE_URL: https://spring.opencodingsociety.com
          PAGES_BOT_UID: ${{ secrets.PAGES_BOT_UID }}
          PAGES_BOT_PASSWORD: ${{ secrets.PAGES_BOT_PASSWORD }}
        run: |
          # Sync needs the bot password. Without it, skip with a warning so an
          # unconfigured repo doesn't fail every push (dry-run locally instead).
          if [ -z "$PAGES_BOT_PASSWORD" ]; then
            echo "::warning::PAGES_BOT_PASSWORD secret is not set — skipping assignment sync. Set it in Settings → Secrets and variables → Actions to enable."
            exit 0
          fi
          # Fallback: scripts/create_assignments_from_frontmatter.py (same arguments).
          python3 scripts/sync_assignments.py \
            --root . \
            --base-url "$BASE_URL" \
            --uid "$PAGES_BOT_UID" \
            --password "$PAGES_BOT_PASSWORD"