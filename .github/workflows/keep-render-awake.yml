# Keep the free-tier Render makerspace API awake.
# Render sleeps after ~15 min idle; cold starts take 30–60s and school
# firewalls often drop the connection first (browser shows "Failed to fetch").
name: Keep makerspace API awake

on:
  schedule:
    # Every 10 minutes (Render free tier sleeps after ~15 min).
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: |
          set -euo pipefail
          URL="${MAKERSPACE_API:-https://makerspace-api-o7u6.onrender.com}/api/health"
          echo "Pinging $URL"
          # Retry a few times — first hit after sleep can take ~60s.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          echo "makerspace API health check failed"
          exit 1
