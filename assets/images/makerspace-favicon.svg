<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Del Norte Makerspace">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1fa8c4"/>
      <stop offset="100%" stop-color="#3ec4d9"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f7f99"/>
      <stop offset="100%" stop-color="#0c2a3a"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2a83b"/>
      <stop offset="100%" stop-color="#b87d18"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c2a3a"/>
  <!-- Isometric 3D cube -->
  <polygon points="32,12 52,23 32,34 12,23" fill="url(#faceTop)"/>
  <polygon points="12,23 32,34 32,54 12,43" fill="url(#faceLeft)"/>
  <polygon points="52,23 32,34 32,54 52,43" fill="url(#faceRight)"/>
  <!-- Gold accent corner -->
  <circle cx="48" cy="48" r="6" fill="#e2a83b"/>
  <circle cx="48" cy="48" r="2.5" fill="#0c2a3a"/>
</svg>
