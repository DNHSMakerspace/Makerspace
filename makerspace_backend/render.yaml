# Render blueprint — Del Norte Makerspace API
# Prefer the copy at repo root (render.yaml). This file is kept in sync.
# After first deploy, copy the service URL into _config.yml:
#   makerspace_api: "https://<your-service>.onrender.com"
services:
  - type: web
    name: makerspace-api
    runtime: docker
    plan: free
    rootDir: makerspace_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MAKERSPACE_FLASK_API
        value: "https://flask.opencodingsociety.com"
