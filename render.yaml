# Render blueprint — Del Norte Makerspace API
# Deploy: Render Dashboard → New → Blueprint → repo DNHSMakerspace/Makerspace
# Blueprint Path: leave blank (this file is at repo root).
# After first deploy, copy the service URL into _config.yml:
#   makerspace_api: "https://<your-service>.onrender.com"
#
# Free plan notes:
# - Service sleeps after idle; first request after sleep can take ~30–60s.
# - Persistent disks are a paid Render feature. Without a disk, data/db.json
#   resets on redeploy/restart (admin seed still works for re-sign-in).
services:
  - type: web
    name: makerspace-api
    runtime: docker
    plan: free
    # Paths below are relative to rootDir (makerspace_backend/).
    rootDir: makerspace_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MAKERSPACE_FLASK_API
        value: "https://flask.opencodingsociety.com"
