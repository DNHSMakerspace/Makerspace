# Render blueprint — Del Norte Makerspace API
# Deploy: Render Dashboard → New → Blueprint → repo DNHSMakerspace/Makerspace
# Blueprint Path: leave blank (this file is at repo root).
# After first deploy, copy the service URL into _config.yml:
#   makerspace_api: "https://<your-service>.onrender.com"
#
# Free plan notes:
# - Service sleeps after idle; first request after sleep can take ~30–60s.
# - Persistent disks are a paid Render feature. WITHOUT a durable backend,
#   data/db.json resets on every redeploy/cold start (members/chats/inventory
#   fall back to seed). Default fix (school Flask snapshot):
#     python3 makerspace_backend/setup_remote_db.py --force-backup
#   then in Render → Environment set:
#     MAKERSPACE_STATE_SECRET=<long random string>
#   Optional extra store: MAKERSPACE_DATA_URL=https://jsonblob.com/api/jsonBlob/...
# - Disable Auto Deploy on the service so routine git pushes do not redeploy
#   the API (GitHub Pages still updates from the same push).
services:
  - type: web
    name: makerspace-api
    runtime: docker
    plan: free
    # Paths below are relative to rootDir (makerspace_backend/).
    rootDir: makerspace_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MAKERSPACE_FLASK_API
        value: "https://flask.opencodingsociety.com"
      # REQUIRED in production — encrypts the Flask state snapshot:
      # - key: MAKERSPACE_STATE_SECRET
      #   generateValue: true
      # Optional extra GET/PUT JSON store:
      # - key: MAKERSPACE_DATA_URL
      #   value: "https://jsonblob.com/api/jsonBlob/YOUR_BLOB_ID"
